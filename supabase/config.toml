# Supabase CLI configuration for local development (`supabase start`).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "restaurant-os"

[api]
enabled = true
port = 54321
# Only `public` is exposed. Business tables live in `app_private` (never exposed).
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
# The demo seed needs Auth users created through the Auth Admin API, so it runs as
# `pnpm seed:demo` after `supabase start` instead of a SQL seed file.
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
# Local email catcher for invites/recovery (Mailpit in recent CLI versions).
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.restaurant-media-public]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/webp", "image/jpeg", "image/avif", "image/png"]

[storage.buckets.restaurant-media-private]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/webp", "image/jpeg", "image/avif", "image/png", "image/svg+xml"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# No public sign-up: staff join by invitation only.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
max_frequency = "30s"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 60
token_verifications = 60

[analytics]
enabled = false
