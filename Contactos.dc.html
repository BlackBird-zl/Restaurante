<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Contactos — Pátio do Ferro, Porto</title>
  <meta name="description" content="Morada, horário e contactos do Pátio do Ferro.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
  <script src="./image-slot.js"></script>
  <script src="./carta-data.js"></script>
  <style>body{margin:0;background:#F1F2EE;color:#252B29;font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:24px;text-wrap:pretty;overflow-x:clip}*,*::before,*::after{box-sizing:border-box}a{color:#252B29;text-underline-offset:4px}a:hover{color:#59635E}:focus-visible{outline:2px solid #252B29;outline-offset:3px}@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}</style>
</helmet>
<dc-import name="SiteHeader" active="contactos" hint-size="100%,64px"></dc-import>
<main style="max-width: 1248px; margin: 0 auto; padding: 0 clamp(16px, 5vw, 48px) clamp(40px, 6vw, 64px);">
  <h1 data-screen-label="Contactos" style="margin: 0; padding-top: clamp(32px, 5vw, 48px); font-size: clamp(32px, 4.7vw, 48px); line-height: 1.08; font-weight: 500; font-stretch: 85%; letter-spacing: -0.02em;">Contactos</h1>
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px 48px; margin-top: 32px; align-items: start;">
    <div style="display: flex; flex-direction: column; gap: 32px;">
      <section aria-labelledby="h-onde">
        <h2 id="h-onde" style="margin: 0 0 8px; font-size: clamp(25px, 2.8vw, 28px); line-height: 1.15; font-weight: 600; font-stretch: 95%;">Onde</h2>
        <address style="font-style: normal; font-size: 18px; line-height: 28px;">{{ morada }}<br>{{ cp }}</address>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 19px; font-weight: 500; color: #59635E;">Morada de demonstração. O mapa é ativado com a morada real validada.</p>
      </section>
      <section aria-labelledby="h-quando">
        <h2 id="h-quando" style="margin: 0 0 8px; font-size: clamp(25px, 2.8vw, 28px); line-height: 1.15; font-weight: 600; font-stretch: 95%;">Horário</h2>
        <dl style="margin: 0; border-top: 1px solid #B7BEB8;">
          <sc-for list="{{ horario }}" as="h" hint-placeholder-count="4">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 16px; padding: 12px 0; border-bottom: 1px solid #B7BEB8;">
              <dt style="font-weight: 600;">{{ h.d }}</dt>
              <dd style="margin: 0; font-variant-numeric: tabular-nums; color: #59635E;">{{ h.h }}</dd>
            </div>
          </sc-for>
        </dl>
      </section>
      <section aria-labelledby="h-falar">
        <h2 id="h-falar" style="margin: 0 0 8px; font-size: clamp(25px, 2.8vw, 28px); line-height: 1.15; font-weight: 600; font-stretch: 95%;">Falar com a casa</h2>
        <p style="margin: 0; font-size: 18px; line-height: 28px;">{{ telefone }}<br>{{ email }}</p>
        <p style="margin: 4px 0 0; font-size: 13px; line-height: 19px; font-weight: 500; color: #59635E;">Contactos fictícios — não ligam a nenhum estabelecimento.</p>
        <a href="Reservas.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 12px 20px; margin-top: 20px; background: #252B29; color: #FFFFFF; border-radius: 2px; font-weight: 600; text-decoration: none;">Pedir reserva</a>
      </section>
    </div>
    <figure style="margin: 0;">
      <div style="position: relative; width: 100%; aspect-ratio: 4 / 3; background: #FFFFFF;">
        <image-slot id="media-E01" src="./assets/media/E01.webp" shape="rect" placeholder="E01 · Limiar — anoitecer" role="img" aria-label="O limiar e o ambiente da casa ao anoitecer."></image-slot>
      </div>
      <div aria-hidden="true" style="display: flex; gap: clamp(16px, 4vw, 32px); margin: 16px 0 8px;">
        <span style="flex: 0 0 calc(62.5% - clamp(8px, 2vw, 16px)); height: 2px; background: #252B29;"></span>
        <span style="flex: 1 1 auto; height: 2px; background: #252B29;"></span>
      </div>
      <figcaption style="font-size: 13px; line-height: 19px; font-weight: 500; color: #59635E;">A entrada, vista da rua.</figcaption>
    </figure>
  </div>
</main>
<dc-import name="SiteFooter" hint-size="100%,240px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: !!window.PATIO };
  componentDidMount() { const wait = () => window.PATIO ? this.setState({ ready: true }) : setTimeout(wait, 40); wait(); }
  renderVals() {
    if (!this.state.ready) return { horario: [] };
    const C = window.PATIO.casa;
    return { morada: C.morada, cp: C.cp, telefone: C.telefone, email: C.email, horario: C.horario };
  }
}
</script>
</body>
</html>
