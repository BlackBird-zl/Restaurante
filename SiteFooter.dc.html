<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
  <script src="./carta-data.js"></script>
</helmet>
<footer style="{{ footStyle }}">
  <div style="max-width: 1248px; margin: 0 auto; padding: 40px clamp(16px, 5vw, 48px) 32px; display: flex; flex-wrap: wrap; gap: 32px 64px; font-size: 16px; line-height: 24px;">
    <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-weight: 600; font-stretch: 85%; font-size: 18px;">Pátio do Ferro</span>
      <span style="color: #59635E;">Cozinha de brasa e mesa de bairro · Porto</span>
    </div>
    <nav aria-label="Rodapé" style="flex: 1 1 180px; display: flex; flex-direction: column;">
      <a href="Carta.dc.html" style="min-height: 32px; text-decoration: none;">Carta</a>
      <a href="Ambiente.dc.html" style="min-height: 32px; text-decoration: none;">Ambiente</a>
      <a href="Sobre.dc.html" style="min-height: 32px; text-decoration: none;">Sobre</a>
      <a href="Contactos.dc.html" style="min-height: 32px; text-decoration: none;">Contactos</a>
      <a href="Reservas.dc.html" style="min-height: 32px; text-decoration: none;">Reservas</a>
    </nav>
    <div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 4px;">
      <span>{{ morada }}</span>
      <span>{{ telefone }}</span>
      <span>{{ email }}</span>
    </div>
    <p style="flex: 1 1 100%; margin: 0; padding-top: 16px; border-top: 1px solid #B7BEB8; font-size: 13px; line-height: 19px; font-weight: 500; color: #59635E;">Restaurante fictício · demonstração. Morada, contactos, equipa e fotografias são exemplos do template.</p>
  </div>
</footer>
<sc-if value="{{ showBar }}" hint-placeholder-val="{{ false }}">
  <nav aria-label="Ações rápidas" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #F1F2EE; border-top: 1px solid #B7BEB8; padding: 4px 16px calc(4px + env(safe-area-inset-bottom)); display: flex; gap: 8px; height: calc(56px + env(safe-area-inset-bottom));">
    <a href="Carta.dc.html" aria-current="{{ cartaCurrent }}" style="{{ cartaStyle }}">Carta</a>
    <a href="Reservas.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 48px; background: #252B29; color: #FFFFFF; border-radius: 2px; font-weight: 600; text-decoration: none;">Reservas</a>
  </nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;320px&quot;},&quot;bar&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;carta&quot;,&quot;produto&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: window.innerWidth, ready: !!window.PATIO };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
    const wait = () => window.PATIO ? this.setState({ ready: true }) : setTimeout(wait, 40);
    wait();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const c = (window.PATIO && window.PATIO.casa) || {};
    const bar = this.props.bar;
    const showBar = !!bar && this.state.w < 768;
    const onCarta = bar === 'carta';
    return {
      morada: (c.morada || '') + ' · ' + (c.cp || ''), telefone: c.telefone, email: c.email,
      showBar,
      footStyle: { borderTop: '1px solid #B7BEB8', paddingBottom: showBar ? 'calc(56px + env(safe-area-inset-bottom))' : 0 },
      cartaCurrent: onCarta ? 'page' : undefined,
      cartaStyle: { flex: '1 1 0', display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: 48, border: '1px solid #252B29', borderRadius: 2,
        fontWeight: 600, textDecoration: onCarta ? 'underline' : 'none', textDecorationThickness: 2, textUnderlineOffset: 6, color: '#252B29' }
    };
  }
}
</script>
</body>
</html>
