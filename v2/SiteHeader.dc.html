<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-87c28065-3c85-47a5-99de-ff79823d05ad/styles.css">
  <script src="_ds/organic-87c28065-3c85-47a5-99de-ff79823d05ad/_ds_bundle.js"></script>
</helmet>
<header style="position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--color-bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
  <div style="max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 28px; padding: 14px clamp(20px, 4vw, 56px);">
    <a href="Home.dc.html" aria-label="Pátio do Ferro — início" style="display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--color-text); margin-right: auto;">
      <span style="font-family: var(--font-heading); font-size: 21px; line-height: 1; letter-spacing: -0.01em;">Pátio do Ferro</span>
      <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--color-neutral-700);">Porto</span>
    </a>
    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="Principal" style="display: flex; gap: 26px; align-items: center;">
        <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
          <a href="{{ l.href }}" aria-current="{{ l.current }}" style="{{ l.style }}" style-hover="color: var(--color-accent-700); background-size: 100% 1.5px;">{{ l.label }}</a>
        </sc-for>
      </nav>
    </sc-if>
    <a href="Reservas.dc.html" class="btn btn-primary" style="flex: none; white-space: nowrap; font-size: 14px; padding: 10px 18px; min-height: 44px;">{{ ctaLabel }}</a>
    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="btn btn-secondary btn-icon" aria-label="Abrir menu" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="width: 44px; height: 44px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h10"></path></svg>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="Menu" style="position: fixed; inset: 0; z-index: 60; background: var(--color-neutral-900); color: var(--color-neutral-100); display: flex; flex-direction: column; padding: 14px 20px 28px; overflow-y: auto;">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px;">
        <span style="font-family: var(--font-heading); font-size: 21px;">Pátio do Ferro</span>
        <button type="button" class="btn btn-icon" aria-label="Fechar menu" onClick="{{ toggle }}" style="width: 44px; height: 44px; color: var(--color-neutral-100); border: 1px solid color-mix(in srgb, var(--color-neutral-100) 30%, transparent);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <nav aria-label="Principal" style="display: flex; flex-direction: column; gap: 6px; margin-top: 48px;">
        <sc-for list="{{ allLinks }}" as="l" hint-placeholder-count="6">
          <a href="{{ l.href }}" aria-current="{{ l.current }}" style="font-family: var(--font-heading); font-size: 44px; line-height: 1.15; color: var(--color-neutral-100); text-decoration: none; display: flex; align-items: baseline; gap: 14px;">
            <span style="font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--color-accent-400); min-width: 22px;">{{ l.num }}</span>{{ l.label }}
          </a>
        </sc-for>
      </nav>
      <div style="margin-top: auto; padding-top: 40px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--color-neutral-300);">
        <span>Rua do Bonjardim, 418 · Porto</span>
        <span>Terça a domingo, a partir das 19h</span>
        <a href="tel:+351220000418" style="color: var(--color-accent-400); margin-top: 8px;">+351 220 000 418</a>
      </div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;80px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;carta&quot;,&quot;sobre&quot;,&quot;ambiente&quot;,&quot;reservas&quot;,&quot;contactos&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, w: typeof window !== 'undefined' ? window.innerWidth : 1200 };
  componentDidMount() {
    this.onR = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this.onR);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); document.body.style.overflow = ''; }
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = [
      ['carta', 'A carta', 'Carta.dc.html'],
      ['sobre', 'A casa', 'Sobre.dc.html'],
      ['ambiente', 'Ambiente', 'Ambiente.dc.html'],
      ['contactos', 'Contactos', 'Contactos.dc.html']
    ];
    const mk = ([id, label, href], i) => {
      const cur = id === active;
      return { label, href, num: String(i + 1).padStart(2, '0'), current: cur ? 'page' : undefined,
        style: {
          fontSize: 15, textDecoration: 'none', paddingBottom: 3,
          color: cur ? 'var(--color-accent-700)' : 'var(--color-text)',
          backgroundImage: 'linear-gradient(currentColor, currentColor)', backgroundRepeat: 'no-repeat',
          backgroundPosition: '0 100%', backgroundSize: cur ? '100% 1.5px' : '0% 1.5px',
          transition: 'background-size .5s cubic-bezier(.2,.7,.2,1), color .3s'
        } };
    };
    const links = base.map(mk);
    const all = [['home', 'Início', 'Home.dc.html'], ...base, ['reservas', 'Reservar', 'Reservas.dc.html']].map(mk);
    const wide = this.state.w >= 860;
    const toggle = () => {
      const open = !this.state.open;
      document.body.style.overflow = open ? 'hidden' : '';
      this.setState({ open });
    };
    return { ctaLabel: this.state.w < 1000 ? 'Reservar' : 'Reservar mesa', links, allLinks: all, wide, narrow: !wide, open: this.state.open, showMenu: this.state.open && !wide, toggle };
  }
}
</script>
</body>
</html>
